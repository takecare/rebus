name: ci

# Actions minutes are unmetered on public repositories, which is why this repo
# is public. If it ever goes private again, this workflow starts drawing down
# the 2,000 min/month free allowance and the e2e job is the first thing to cut.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci

  e2e:
    name: full game against a real Durable Object
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # wrangler will not boot without client/dist, and test:e2e:ci starts its
      # own worker, so the build has to come first.
      - run: npm run build
      - run: npm run test:e2e:ci

  deploy:
    name: deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: [check, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: wrangler deploy
        run: npx wrangler deploy --config server/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
